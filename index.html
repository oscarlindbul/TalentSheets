<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talent Sheet Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Toolbar -->
  <div id="toolbar">
    <div id="add-talent-wrapper">
      <button id="btn-add-box" title="Choose box type">&#43; Add Box &#9662;</button>
      <div id="add-talent-menu" class="dropdown-menu">
        <button data-type="action">&#9632; Action</button>
        <button data-type="passive">&#9632; Passive</button>
        <button data-type="skill">&#9632; Skill</button>
        <button data-type="maneuver">&#9632; Maneuver</button>
        <button data-type="incidental">&#9632; Incidental</button>
      </div>
    </div>
    <div id="insert-symbol-wrapper">
      <button id="btn-insert-symbol" title="Insert Genesys die symbol" disabled>&#9674; Dice &#9662;</button>
      <div id="insert-symbol-menu" class="dropdown-menu"></div>
    </div>
    <div id="insert-image-symbol-wrapper">
      <button id="btn-insert-image-symbol" title="Insert Genesys PNG symbol" disabled>&#128444; Symbols &#9662;</button>
      <div id="insert-image-symbol-menu" class="dropdown-menu"></div>
    </div>
    <button id="btn-toggle-theme" title="Toggle Light/Dark Mode">&#9790; Theme</button>
    <button id="btn-add-text" title="Click, then click on the page to place a text field">&#84; Add Text</button>
    <button id="btn-add-dashed-line" title="Click, then click two points to place a dashed line">&#9473; Dashed Line</button>
    <button id="btn-save" title="Save to JSON">&#128190; Save</button>
    <button id="btn-load" title="Load from JSON">&#128194; Load</button>
    <input type="file" id="file-input" accept=".json" style="display:none">
    <button id="btn-export-pdf" title="Export as A1 PDF">&#128462; Export PDF</button>
    <span id="toolbar-spacer"></span>
    <label>Box W:
      <input type="number" id="box-w-input" value="200" min="60" max="600" step="10" title="Box width (px)">
    </label>
    <label>Box H:
      <input type="number" id="box-h-input" value="140" min="60" max="600" step="10" title="Box height (px)">
    </label>
    <label>Bridge:
      <input type="number" id="bridge-w-input" value="2.5" min="0.5" max="20" step="0.5" title="Bridge line width">
    </label>
    <div id="font-controls-group">
      <span class="font-group-label">Font</span>
      <label id="font-label">
        <select id="font-select" disabled>
          <option value="serif">Serif</option>
          <option value="sans-serif" selected>Sans-Serif</option>
          <option value="monospace">Monospace</option>
          <option value="Georgia">Georgia</option>
          <option value="Palatino">Palatino</option>
          <option value="Garamond">Garamond</option>
        </select>
      </label>
      <input type="number" id="font-size-input" value="13" min="6" max="72" step="1" title="Font size (px)" disabled>
      <input type="color" id="font-color-input" value="#222222" title="Font color" disabled>
      <button id="font-bold-btn" class="font-fmt-btn" disabled title="Bold"><b>B</b></button>
      <button id="font-italic-btn" class="font-fmt-btn" disabled title="Italic"><i>I</i></button>
      <button id="font-underline-btn" class="font-fmt-btn" disabled title="Underline"><u>U</u></button>
    </div>
    <label id="color-label">Box Stroke:
      <input type="color" id="color-stroke" value="#444444">
    </label>
    <label id="fill-label">Box Fill:
      <input type="color" id="color-fill" value="#f5f0e1">
    </label>
    <label>Bridge:
      <input type="color" id="color-bridge" value="#666666" title="Bridge line color">
    </label>
  </div>

  <!-- Page wrapper handles fit-to-window scaling -->
  <div id="page-wrapper">
    <div id="page-container">
      <div id="two-canvas"></div>
      <div id="overlay">
      <!-- Legend (created here, made draggable by JS) -->
      <div id="sheet-legend">
        <div class="legend-content">
          <div class="legend-title">Legend</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#c94040"></span> Action Talent</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#3c78b5"></span> Passive Talent</div>
          <div class="legend-item"><span class="legend-swatch legend-swatch-skill" style="background:#7b4fbf"></span> Skill</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#d9862a"></span> Maneuver</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#3c9b4a"></span> Incidental</div>
          <div class="legend-item"><input type="checkbox" disabled> Acquired</div>
          <div class="legend-item"><span class="legend-ranked"><span></span><span></span><span></span><span></span></span> Ranked Talent</div>
          <div class="legend-item"><span class="legend-line"></span> Spec Pathway</div>
        </div>
        <div class="legend-resize-handle" title="Resize legend"></div>
      </div>
    </div>
  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/dom-to-image@2.6.0/dist/dom-to-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="two/two.min.js"></script>
  <script src="box.js"></script>
  <script src="pdf-export.js"></script>
  <script src="json-utils.js"></script>
  <script src="events.js"></script>
  <script src="app.js"></script>
</body>
</html>
